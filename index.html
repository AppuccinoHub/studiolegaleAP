<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D11">
<title>Studio Legale · AP Italian</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0D11; --surf:#17171E; --surf2:#22222C; --line:#33333F;
  --text:#F6F4EE; --mute:#A9A6B4; --paper:#F6F4EE; --ink:#0D0D11;
  --acid:#C8FF3D; --acid-d:#8DB81C; --hot:#FF4A2E; --hot-d:#B8301B; --gold:#FFC83D;
  --good:#3DDC84; --bad:#FF4A2E;
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;padding-bottom:88px;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:var(--acid)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.02}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.mute{color:var(--mute)}

/* header + nav */
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;flex-wrap:wrap}
.top .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.top .grow{flex-grow:1}
.top input{font:500 14px var(--sans);padding:8px 12px;min-height:40px;border:2px solid var(--line);border-radius:12px;background:var(--surf);color:var(--text);width:150px}
.top input::placeholder{color:#7C7A86}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:8px 12px;min-height:40px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--mute)}
.chip.on{border-color:var(--acid);color:var(--acid)}
nav.tabs{order:1;position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(13,13,17,.94);backdrop-filter:blur(10px);border-top:2px solid var(--line)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;min-height:52px;border-radius:14px;text-decoration:none;color:var(--mute);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
nav.tabs a.on{color:var(--ink);background:var(--acid)}
nav.tabs svg{width:22px;height:22px;fill:currentColor}
main{order:2;width:100%;max-width:1060px;margin:0 auto;padding:8px 20px 40px}
.alert{background:var(--hot);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:14px;font-weight:500}
.alert button{background:#fff;color:var(--hot-d);border:0;border-radius:10px;padding:8px 14px;min-height:40px;font-weight:700}
@media (min-width:901px){
  body{padding-bottom:0}
  nav.tabs{position:static;order:1;background:transparent;backdrop-filter:none;border-top:0;max-width:1060px;width:100%;margin:0 auto;padding:0 20px 8px}
  nav.tabs a{flex:0 0 auto;flex-direction:row;gap:8px;padding:10px 18px;min-height:44px;font-size:11px}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 16px var(--sans);padding:14px 22px;min-height:52px;border-radius:16px;border:0;border-bottom:5px solid var(--acid-d);background:var(--acid);color:var(--ink);text-decoration:none;transition:transform .08s,border-bottom-width .08s}
.btn:active{transform:translateY(4px);border-bottom-width:1px}
.btn.alt{background:var(--surf2);color:var(--text);border-bottom-color:#12121a}
.btn.hot{background:var(--hot);color:#fff;border-bottom-color:var(--hot-d)}
.btn.ghost{background:transparent;border:2px solid var(--line);border-bottom-width:2px;color:var(--text)}
.btn.sm{min-height:44px;padding:10px 16px;font-size:14px;border-radius:12px;border-bottom-width:4px}
.btn[disabled]{background:var(--surf2);border-bottom-color:var(--surf2);color:#7C7A86;cursor:not-allowed}
.btn[disabled]:active{transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}

/* cards */
.card{background:var(--surf);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--line)}
.card.acid{background:var(--acid);color:var(--ink);border-color:var(--acid)}
.card.acid .mute{color:#3b4a0c}
.card.hot{background:var(--hot);border-color:var(--hot);color:#fff}
.card.paper{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.hello{margin:18px 0 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hello h1{font-size:clamp(34px,6vw,58px)}
.streak{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--surf);border:2px solid var(--line);font-family:var(--display);font-weight:800;font-size:20px}
.streak svg{width:20px;height:20px;fill:var(--gold)}
.streak.cold svg{fill:#55535f}
.big{font-family:var(--display);font-weight:800;letter-spacing:-.03em;line-height:.98;font-size:clamp(28px,5vw,44px)}

/* path */
.path{position:relative;display:flex;justify-content:space-between;gap:6px;padding:6px 4px}
.path::before{content:'';position:absolute;left:24px;right:24px;top:28px;height:4px;background:var(--line);border-radius:2px}
.node{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px;background:var(--surf2);color:#7C7A86;border:3px solid var(--bg);text-decoration:none}
.node.done{background:var(--acid);color:var(--ink)}
.node.now{background:var(--bg);color:var(--acid);border:3px solid var(--acid);animation:pulse 1.8s infinite}
.node svg{width:22px;height:22px;fill:var(--ink)}
.pathlbl{display:flex;justify-content:space-between;margin-top:6px}

/* skills */
.skill{background:var(--surf);border-radius:18px;padding:14px;border:2px solid var(--line);display:flex;flex-direction:column;gap:10px;min-height:96px;justify-content:space-between}
.skill .bar{height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.skill .bar>div{height:8px;background:var(--acid);border-radius:4px}
.skill.done{border-color:var(--acid)}
.skill .t{font-size:14px;font-weight:500;line-height:1.3}

/* prove */
.prova{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.prova>.l{flex:1 1 440px;min-width:0}.prova>.r{flex:1 1 440px;min-width:0}
.reading .intro{font-size:14px;color:#55535f;line-height:1.55;font-style:italic}
.reading .body p{font:400 17px/1.75 var(--sans);margin:0 0 14px}
.reading a.btn{align-self:flex-start}
.segs{display:flex;gap:6px;margin-bottom:6px}
.segs i{flex:1;height:8px;border-radius:4px;background:var(--surf2)}
.segs i.on{background:var(--acid)}
textarea{width:100%;font:400 17px/1.6 var(--sans);padding:16px;border:2px solid var(--line);border-radius:16px;background:var(--surf2);color:var(--text);resize:vertical;min-height:130px}
.reading textarea{background:#fff;color:var(--ink);border-color:#d9d6cd}
textarea:focus{border-color:var(--acid);outline:0}
.field label{display:block;font-family:var(--display);font-weight:800;font-size:20px;margin-bottom:2px}
.field .hint{font-size:13px;color:var(--mute);margin:0 0 8px}
.field .cnt{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:6px}
.stem{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.4vw,26px);line-height:1.2;letter-spacing:-.01em}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:16px;background:var(--surf2);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;font:500 16px/1.4 var(--sans);color:var(--text);min-height:56px;transition:transform .08s}
.opt b{font-family:var(--mono);font-weight:700;width:22px;flex-shrink:0;color:var(--acid)}
.opt:hover:not([disabled]){border-color:var(--acid)}
.opt:active:not([disabled]){transform:translateY(3px);border-bottom-width:2px}
.opt.good{background:#12301f;border-color:var(--good);animation:pop .35s}
.opt.bad{background:#3a140d;border-color:var(--bad);animation:shake .4s}
.opt[disabled]{cursor:default}
.why{border-radius:16px;background:var(--surf2);border-left:6px solid var(--gold);padding:14px 16px;font-size:15px;animation:rise .3s}
.why strong{color:var(--gold)}
.stamp{display:inline-block;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--hot);border:3px solid var(--hot);border-radius:8px;padding:6px 10px;transform:rotate(-4deg);animation:slam .5s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.card.acid .stamp,.card.paper .stamp{color:var(--hot-d);border-color:var(--hot-d)}
.bigscore{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;letter-spacing:-.04em}
.rev{display:flex;gap:12px;padding:12px 0;border-top:2px solid var(--line);font-size:14px}
.rev .m{font-family:var(--mono);font-weight:700;width:22px;flex-shrink:0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{border-radius:14px;padding:12px;font-size:14px;line-height:1.5;background:var(--surf2)}
.cmp>div.m2{background:#2a2410;border:2px solid var(--gold)}
.flip{min-height:240px;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--acid);color:var(--ink);border:0;border-bottom:6px solid var(--acid-d);border-radius:24px;font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);letter-spacing:-.02em;line-height:1.05}
.flip small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;margin-top:14px;opacity:.7;font-weight:500}
.vcell{display:flex;flex-direction:column;gap:6px}
.vcard{width:100%;min-height:120px;padding:14px;border-radius:18px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surf2);color:var(--text);font:700 18px/1.2 var(--display);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .08s}
.vcard.en{background:var(--acid);color:var(--ink);border-color:var(--acid);border-bottom-color:var(--acid-d)}
.vcard .ex{font:italic 400 13px/1.4 var(--sans)}
.vcard small{font-family:var(--mono);font-size:10px;letter-spacing:.08em;opacity:.7;font-weight:500}
.vcard:active{transform:translateY(3px);border-bottom-width:2px}
.ring{position:relative;width:96px;height:96px;flex-shrink:0}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:22px}
.conf{position:fixed;left:50%;top:40%;z-index:50;pointer-events:none}
.conf span{position:absolute;width:10px;height:14px;border-radius:2px;animation:conf 1.1s ease-out forwards}
@keyframes slam{0%{transform:scale(2.6) rotate(-14deg);opacity:0}60%{transform:scale(.9) rotate(-3deg);opacity:1}100%{transform:scale(1) rotate(-4deg)}}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,255,61,.5)}50%{box-shadow:0 0 0 10px rgba(200,255,61,0)}}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.cmp{grid-template-columns:1fr}.top input{width:120px}}
</style>
</head>

<script>
'use strict';

/* ============================================================
   CONTENT — add new exhibits to EXHIBITS, new descriptors to
   DESCRIPTORS. Nothing else needs to change.
   Copyright rule: article text is NEVER stored in this file.
   Students open the original (url) or paste the text locally.
   ============================================================ */

const CASES = [
  { n:1, name:'Identità personale e pubblica', color:'#7C8CFF', opens:'26 OTT', open:true },
  { n:2, name:'Famiglia e comunità',           color:'#3DDC84', opens:'16 NOV' },
  { n:3, name:'Vita contemporanea',            color:'#FFA94D', opens:'14 DIC' },
  { n:4, name:'Bellezza ed estetica',          color:'#E070FF', opens:'18 GEN' },
  { n:5, name:'Scienza e tecnologia',          color:'#3DD6E0', opens:'15 FEB' },
  { n:6, name:'Sfide globali',                 color:'#D9A066', opens:'15 MAR' }
];

const DESCRIPTORS = [
  { task:'La corrispondenza', meta:'Email · 15 min', items:['Formal register, consistent','Answers both questions','Asks for a detail back','Opening + closing conventions','Accuracy: forms + connectors'] },
  { task:"L'arringa", meta:'Essay · 55 min', items:['Clear thesis','Cites all 3 exhibits','Counter-argument addressed','Organized paragraphs','Rich, precise vocabulary','Accuracy: complex structures'] },
  { task:"L'interrogatorio", meta:'Conversation · 5 × 20 s', items:['Full 20 s, every turn','Answers what was asked','Elaborates, not one-liners','Register matches the speaker','Pronunciation does not block'] },
  { task:'Il parere', meta:'Cultural comparison · 2 min', items:['Both communities compared','Concrete Italian evidence','Clear structure, intro → close','Fills 2 min, no dead air','Accuracy under time'] }
];

const EXHIBITS = [
  {
    id:'p01', caso:1, n:1, type:'LETTURA',
    title:'Adolescenti e social, il paradosso di una generazione: riconoscono i rischi, ma hanno paura di dire no',
    short:'I rischi online? Li riconoscono. Dire no? Non ci riescono.',
    author:'Francesco Pira, sociologo, Università di Messina · QdS (Quotidiano di Sicilia), 16 ottobre 2026',
    intro:"Il seguente articolo di Francesco Pira, professore di Sociologia all'Università di Messina, pubblicato sul Quotidiano di Sicilia (QdS) il 16 ottobre 2026, commenta i risultati della Survey Teen 2026 su adolescenti e social network (Ipsos Doxa per Fondazione Libellula).",
    url:'https://qds.it/adolescenti-social-paradosso-generazione-riconoscono-rischi-ma-hanno-paura-di-dire-no/',
    minutes:45,
    analysis:[
      { k:'tesi',     label:'Tesi',            hint:"Cosa sostiene l'autore? Una frase, con parole tue." },
      { k:'prove',    label:'Prove',           hint:"Quali dati o esempi usa per sostenerla? Cita almeno due numeri." },
      { k:'registro', label:'Registro',        hint:"Che tono ha? A chi parla? (genitori, insegnanti, giovani…)" },
      { k:'lente',    label:'Lente culturale', hint:"Cosa rivela sull'Italia o sui giovani italiani?" }
    ],
    model:{
      tesi:"I giovani riconoscono stereotipi e modelli tossici online, ma senza una rete di sostegno non riescono a prendere posizione quando il problema coinvolge il proprio gruppo di amici.",
      prove:"Dati della Survey Teen 2026: l'85% ha visto gelosia e controllo presentati come normali, il 92% contenuti che svalutano le ragazze, l'89% modelli «alpha» o «sigma»; il 48% modifica le proprie immagini; il 38% si sente solo.",
      registro:"Formale e divulgativo: un sociologo cita ricerche e studiosi (Bourdieu, Goffman) e si rivolge a un pubblico adulto, cioè scuole e famiglie, con un tono di appello più che di accusa.",
      lente:"Mostra una società in cui scuola e famiglia restano i luoghi educativi centrali: la famiglia è ancora il «principale riferimento emotivo», ma la solitudine e la pressione del gruppo pesano soprattutto sulle ragazze."
    },
    vocab:[
      { it:'prendere posizione',                  en:'to take a stand',                      ex:"Quando un amico dice qualcosa di ingiusto, è difficile prendere posizione." },
      { it:'il costo sociale del dissenso',       en:'the social cost of disagreeing',       ex:"Molti tacciono perché temono il costo sociale del dissenso." },
      { it:'una rete di sostegno',                en:'a support network',                    ex:"Senza una rete di sostegno, nessuno trova il coraggio di parlare." },
      { it:'sottrarsi alla pressione del gruppo', en:'to escape peer pressure',              ex:"Per un adolescente è difficile sottrarsi alla pressione del gruppo." },
      { it:'la pressione estetica',               en:'the pressure to look a certain way',   ex:"I social aumentano la pressione estetica, soprattutto sulle ragazze." },
      { it:'essere consapevole di',               en:'to be aware of',                       ex:"Sono consapevole dei rischi, ma continuo a usare i social." },
      { it:'riconoscere i rischi',                en:'to recognize the risks',               ex:"Imparare a riconoscere i rischi online è il primo passo." },
      { it:'smontare gli stereotipi',             en:'to take apart / debunk stereotypes',   ex:"A scuola possiamo imparare a smontare gli stereotipi." },
      { it:'restare in silenzio',                 en:'to stay silent',                       ex:"Davanti al gruppo, molti ragazzi restano in silenzio." },
      { it:'sentirsi solo',                       en:'to feel alone',                        ex:"Anche con mille follower, uno può sentirsi solo." },
      { it:'ottenere approvazione',               en:'to gain approval',                     ex:"Molti modificano le foto per ottenere approvazione dagli altri." },
      { it:'un gesto collettivo',                 en:'a collective act',                     ex:"Dire di no insieme è un gesto collettivo, non un atto di coraggio isolato." }
    ],
    write:[
      { i:0,  hint:"About a time a friend says something unfair. What do you do, or not do?" },
      { i:2,  hint:"About what helps people speak up (school, family, friends)." },
      { i:5,  hint:"About something online that you know is a problem." },
      { i:3,  hint:"About peer pressure at school or online." },
      { i:9,  hint:"About being online and feeling alone: yours or someone else's." },
      { i:10, hint:"About why people edit their photos." }
    ],
    mc:[
      { q:"Qual è la tesi centrale dell'articolo di Pira?",
        o:["I giovani non riconoscono i rischi dei social e vanno protetti con divieti.",
           "I giovani riconoscono i rischi online, ma faticano a prendere posizione perché manca una rete che renda sostenibile il dissenso.",
           "La responsabilità dei contenuti tossici ricade soprattutto sulle famiglie.",
           "I social network sono utili soltanto agli adolescenti più sicuri di sé."],
        a:1, why:"Il punto è ripetuto all'inizio e alla fine: «consapevolezza» sì, ma manca «una rete che renda sostenibile il gesto di prendere posizione»." },
      { q:"Secondo la ricerca citata, quale percentuale di adolescenti ha visto online post o video in cui gelosia e controllo nella coppia sono presentati come normali?",
        o:["Il 48%","Il 64%","L'85%","Il 92%"],
        a:2, why:"85% = gelosia e controllo. Il 92% riguarda i contenuti che prendono in giro le ragazze; il 64% è l'uso di TikTok; il 48% chi modifica le proprie immagini." },
      { q:"Secondo i ricercatori, di chi è la responsabilità della circolazione di modelli tossici?",
        o:["Dei singoli creatori di contenuti, che andrebbero sanzionati.",
           "Dei genitori, che non controllano abbastanza i figli.",
           "Dei ragazzi, che scelgono di seguire certi profili.",
           "Non solo dei singoli contenuti, ma anche delle logiche algoritmiche che premiano emozioni forti e polarizzazione."],
        a:3, why:"La citazione è esplicita: «non soltanto dei singoli contenuti, ma delle logiche algoritmiche». Le altre opzioni danno la colpa a una persona sola." },
      { q:"Nel testo, l'espressione «vetrinizzazione dell'identità» suggerisce che…",
        o:["l'identità viene messa in mostra e ridefinita dal gradimento degli altri.",
           "i giovani costruiscono la propria identità in privato, lontano dai social.",
           "le piattaforme vendono prodotti ai giovani attraverso la pubblicità.",
           "gli adolescenti nascondono la propria identità per proteggersi."],
        a:0, why:"Come in una vetrina, l'identità si espone e gli altri, «attraverso il loro gradimento, ci ridefiniscono»." },
      { q:"Qual è il «vero paradosso» che l'articolo mette in evidenza a proposito dell'aspetto estetico?",
        o:["I ragazzi usano i social più di quanto ammettano.",
           "I ragazzi modificano le immagini ma non hanno mai visto contenuti tossici.",
           "Sono consapevoli della pressione estetica delle piattaforme, ma continuano a partecipare perché serve a ottenere approvazione.",
           "Si fidano dei social più che dei propri genitori."],
        a:2, why:"Gli adolescenti sono «perfettamente consapevoli» della pressione, ma restano dentro quelle dinamiche «perché considerate centrali per ottenere approvazione»." },
      { q:"Quale soluzione propone l'autore?",
        o:["Costruire reti, a scuola e in famiglia, che riducano il «costo sociale» del dissenso.",
           "Vietare ai minori l'uso di TikTok e Instagram.",
           "Informare di più gli adolescenti sui rischi, perché non li conoscono.",
           "Lasciare che i ragazzi risolvano da soli le dinamiche del gruppo."],
        a:0, why:"Per l'autore «non basta fornire informazioni o vietare contenuti»: serve rendere il dissenso un gesto collettivo, con scuola e famiglia." }
    ]
  }
];

/* ============================================================
   STORAGE — one JSON object in localStorage, with export/import
   ============================================================ */
const KEY = 'studioLegale.v1';
let mem = null;
function blank(){ return { v:1, student:'', sound:false, exhibits:{}, hearings:{ last:'', streak:0, count:0, lastScore:'' }, lastExport:'' }; }
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e) {}
  if (!raw) return mem || blank();
  try { return Object.assign(blank(), JSON.parse(raw)); } catch(e) { return blank(); }
}
let S = load();
let storageOk = true;
function save(){
  mem = S;
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; } catch(e) { storageOk = false; }
}
function ex(id){
  if (!S.exhibits[id]) S.exhibits[id] = { step:'leggi', analysis:{ tesi:'', prove:'', registro:'', lente:'' }, answers:[], qi:0, filed:false, filedAt:'', score:0, localText:'' };

}
function filedList(){ return EXHIBITS.filter(function(X){ return S.exhibits[X.id] && S.exhibits[X.id].filed; }); }

/* ============================================================

function h(tag, attrs){
  const e = document.createElement(tag);
  const a = attrs || {};
  Object.keys(a).forEach(function(k){
    const v = a[k];
    if (v === false || v == null) return;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  });
  for (let i = 2; i < arguments.length; i++){
    const c = arguments[i];
    (Array.isArray(c) ? c : [c]).forEach(function(x){
      if (x == null || x === false) return;
      e.append(x.nodeType ? x : document.createTextNode(String(x)));
    });
  }
  return e;
}
function svg(str){ const s = document.createElement('span'); s.innerHTML = str; s.style.display = 'inline-flex'; return s; }
const SEAL = '<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="#C8FF3D" stroke-width="2"/><path d="M15 7.5 L17 13 L22.8 13 L18.1 16.4 L19.9 22 L15 18.6 L10.1 22 L11.9 16.4 L7.2 13 L13 13 Z" fill="#C8FF3D"/></svg>';
const BOLT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 17 4.8 12.3l1.9-1.9 2.8 2.8 7.8-7.8 1.9 1.9z"/></svg>';
function shuffle(a){ const x = a.slice(); for (let i = x.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
function pad(n){ return String(n).padStart(2, '0'); }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function prevSchoolDay(d){ const x = new Date(d); do { x.setDate(x.getDate() - 1); } while (x.getDay() === 0 || x.getDay() === 6); return x; }
function fmtDate(iso){ if (!iso) return ''; const d = new Date(iso); const m = ['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC']; return d.getDate() + ' ' + m[d.getMonth()]; }
function streakNow(){
  const H = S.hearings; if (!H.last) return 0;
  const t = new Date();
  return (H.last === ymd(t) || H.last === ymd(prevSchoolDay(t))) ? H.streak : 0;
}
function doneToday(){ return S.hearings.last === ymd(new Date()); }
const LETTERS = ['A','B','C','D'];

/* feedback: sound (off by default) + tiny vibration + confetti */
let AC = null;
function knock(){
  try { if (navigator.vibrate) navigator.vibrate(12); } catch(e) {}
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    [0, 0.11].forEach(function(d){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(190, t + d);
      o.frequency.exponentialRampToValueAtTime(70, t + d + 0.09);
      g.gain.setValueAtTime(0.5, t + d);
      g.gain.exponentialRampToValueAtTime(0.001, t + d + 0.12);
      o.connect(g); g.connect(AC.destination);
      o.start(t + d); o.stop(t + d + 0.13);
    });
  } catch(e) {}
}
function burst(){
  const colors = ['#C8FF3D', '#FF4A2E', '#FFC83D', '#F6F4EE'];
  const box = h('div', { class:'conf', 'aria-hidden':'true' });
  for (let i = 0; i < 26; i++){
    const a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 220;
    box.append(h('span', { style:'background:' + colors[i % 4] + ';--x:' + Math.round(Math.cos(a) * r) + 'px;--y:' + Math.round(Math.sin(a) * r - 40) + 'px;--r:' + Math.round(Math.random() * 720) + 'deg' }));
  }
  document.body.append(box);
  setTimeout(function(){ box.remove(); }, 1300);
}

function exportData(){
  S.lastExport = new Date().toISOString(); save();
  const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'studio-legale-backup-' + ymd(new Date()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  render();
}
function importData(file){
  const r = new FileReader();
  r.onload = function(){
    try {
      const p = JSON.parse(r.result);
      if (!p || p.v !== 1 || typeof p.exhibits !== 'object') throw new Error('bad');
      if (!confirm('Replace everything on this device with this backup?')) return;
      S = Object.assign(blank(), p); save(); render();
    } catch(e){ alert('That file is not a Studio Legale backup.'); }
  };
  r.readAsText(file);
}
function backupDue(){
  if (!filedList().length) return false;
  if (!S.lastExport) return true;
  return (Date.now() - new Date(S.lastExport).getTime()) > 7 * 86400000;
}
function backupAge(){
  if (!S.lastExport) return 'never';
  const d = Math.floor((Date.now() - new Date(S.lastExport).getTime()) / 86400000);
  return d === 0 ? 'today' : d + (d === 1 ? ' day ago' : ' days ago');
}

/* progress of an exhibit, 0..100 */
function progressOf(X){
  const st = ex(X.id);
  if (st.filed) return 100;
  if (st.step === 'leggi') return 0;
  if (st.step === 'vocab') return 15;
  if (st.step === 'analisi') return 35;
  if (st.step === 'domande') return 55 + Math.round((st.answers.filter(function(x){ return x != null; }).length / X.mc.length) * 35);
  return 92;
}
function ring(pct, color, trackColor, textColor){
  const R = 40, C = 2 * Math.PI * R;

  return h('div', { class:'ring', role:'img', 'aria-label':pct + ' percent' }, s, h('div', { class:'v', style:'color:' + textColor }, pct + '%'));
}

function okSentence(t){ t = (t || '').trim(); return t.length >= 20 && t.split(/\s+/).length >= 4; }

function stepVocab(X, st){
  st.sentences = st.sentences || {};
  st.known = st.known || {};
  const knownTxt = h('span', { class:'mono mute' });
  function updKnown(){ knownTxt.textContent = Object.keys(st.known).filter(function(k){ return st.known[k]; }).length + ' / ' + X.vocab.length + ' marked as known'; }
  updKnown();
  const cells = X.vocab.map(function(v, i){
    let showEn = false;
    const side = h('span', {}, v.it);
    const exl = h('span', { class:'ex', style:'display:none' }, '«' + v.ex + '»');
    const hint = h('small', {}, 'TAP FOR MEANING');
    const card = h('button', { class:'vcard', 'aria-label':'Flip card: ' + v.it }, side, exl, hint);
    card.addEventListener('click', function(){
      showEn = !showEn;
      side.textContent = showEn ? v.en : v.it;
      exl.style.display = showEn ? 'block' : 'none';
      hint.textContent = showEn ? 'TAP FOR ITALIAN' : 'TAP FOR MEANING';
      card.classList.toggle('en', showEn);
    });
    const chip = h('button', { class:'chip' + (st.known[i] ? ' on' : ''), 'aria-pressed':st.known[i] ? 'true' : 'false' }, st.known[i] ? 'KNOWN ✓' : 'MARK AS KNOWN');
    chip.addEventListener('click', function(){
      st.known[i] = !st.known[i]; save();
      chip.classList.toggle('on', !!st.known[i]);
      chip.setAttribute('aria-pressed', st.known[i] ? 'true' : 'false');
      chip.textContent = st.known[i] ? 'KNOWN ✓' : 'MARK AS KNOWN';
      updKnown();
    });
    return h('div', { class:'vcell' }, card, chip);
  });
  const btn = h('button', { class:'btn', disabled:true }, 'On to the breakdown →');
  function ready(){ return X.write.every(function(w){ return okSentence(st.sentences[w.i]); }); }
  function refresh(){ if (ready()) btn.removeAttribute('disabled'); else btn.setAttribute('disabled', ''); }
  btn.addEventListener('click', function(){ if (!ready()) return; st.step = 'analisi'; save(); render(); });
  const fields = X.write.map(function(w, k){
    const v = X.vocab[w.i];
    const id = 's-' + w.i;
    const cnt = h('div', { class:'cnt' });
    const ta = h('textarea', { id:id, 'aria-describedby':id + '-h', style:'min-height:96px' });
    ta.value = st.sentences[w.i] || '';
    function upd(){ cnt.textContent = okSentence(ta.value) ? 'Good length' : 'Write a full sentence: at least 4 words'; }
    ta.addEventListener('input', function(){ st.sentences[w.i] = ta.value; save(); upd(); refresh(); });
    upd();
    return h('div', { class:'field' }, h('label', { for:id }, (k + 1) + '. ' + v.it), h('p', { class:'hint', id:id + '-h' }, w.hint), ta, cnt);
  });
  refresh();
  return h('div', { class:'card' }, segs('vocab'),
    h('div', { class:'mono mute' }, 'Step 2 of 5 · Vocabolario'),
    h('h2', { style:'font-size:32px' }, 'Learn the chunks. Then use them.'),
    h('p', { class:'mute', style:'margin:0;font-size:14px' }, 'Twelve phrases from the article. Tap a card to see the meaning and an example. Learn whole phrases, not single words.'),
    h('div', { style:'display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px' }, cells),
    knownTxt,
    h('h2', { style:'font-size:26px;margin-top:10px' }, 'Now make your own sentences'),
    h('p', { class:'mute', style:'margin:0;font-size:14px' }, 'Six chunks, six sentences about your own life. In Italian. You can change the verb ending, but keep the phrase.'),
    fields, h('div', { class:'row' }, btn));
}

function vocabReview(X, st){
  const items = (X.write || []).filter(function(w){ return st.sentences && st.sentences[w.i]; });
  if (!items.length) return null;
  return h('div', {}, h('div', { class:'mono mute', style:'margin-bottom:6px' }, 'Your sentences'),
    items.map(function(w){
      return h('div', { class:'rev', style:'flex-direction:column;gap:4px' }, h('span', { class:'mono', style:'color:#C8FF3D' }, X.vocab[w.i].it), h('span', {}, st.sentences[w.i]));
    }));
}

function stepAnalysis(X, st){
  const btn = h('button', { class:'btn', disabled:true }, 'On to the questions →');
  function ready(){ return X.analysis.every(function(f){ return (st.analysis[f.k] || '').trim().length >= 30; }); }
  function refresh(){ if (ready()) btn.removeAttribute('disabled'); else btn.setAttribute('disabled', ''); }
  btn.addEventListener('click', function(){ if (!ready()) return; st.step = 'domande'; st.qi = st.answers.length >= X.mc.length ? 0 : st.answers.length; save(); render(); });
  const fields = X.analysis.map(function(f){
    const id = 'f-' + f.k;
    const cnt = h('div', { class:'cnt' });
    const ta = h('textarea', { id:id, 'aria-describedby':id + '-h' });
    ta.value = st.analysis[f.k] || '';
    function upd(){ cnt.textContent = ta.value.trim().length + ' characters · min 30'; }
    ta.addEventListener('input', function(){ st.analysis[f.k] = ta.value; save(); upd(); refresh(); });
    upd();
    return h('div', { class:'field' }, h('label', { for:id }, f.label), h('p', { class:'hint', id:id + '-h' }, f.hint), ta, cnt);
  });
  refresh();
  return h('div', { class:'card' }, segs('analisi'),
    h('div', { class:'mono mute' }, 'Step 3 of 5 · Analisi'),
    h('h2', { style:'font-size:32px' }, 'Break it down in four lines.'),
    h('p', { class:'mute', style:'margin:0;font-size:14px' }, 'Write in Italian. After you file, you\'ll see the Prof\'s model next to yours.'),
    fields, h('div', { class:'row' }, btn));
}

function stepQuestions(X, st){
  const qi = Math.min(st.qi || 0, X.mc.length - 1);
  const Q = X.mc[qi];
  const chosen = st.answers[qi];
  const answered = chosen !== undefined && chosen !== null;
  const opts = Q.o.map(function(t, i){
    let cls = 'opt';
    if (answered){ if (i === Q.a) cls += ' good'; else if (i === chosen) cls += ' bad'; }
    return h('button', { class:cls, disabled:answered, onclick:function(){ st.answers[qi] = i; save(); if (i === Q.a) knock(); render(); } }, h('b', {}, LETTERS[i]), h('span', {}, t));
  });
  const last = qi === X.mc.length - 1;
  return h('div', { class:'card' }, segs('domande'),
    h('div', { class:'mono mute' }, 'Step 4 of 5 · Question ' + (qi + 1) + ' of ' + X.mc.length),
    h('div', { class:'stem' }, Q.q), h('div', { class:'stack', style:'gap:10px' }, opts),
    answered ? h('div', { class:'why', role:'status' }, h('strong', {}, chosen === Q.a ? 'Yes. ' : 'Not quite. '), Q.why) : null,
    answered ? h('div', { class:'row' }, h('button', { class:'btn', onclick:function(){ if (last){ st.step = 'esito'; } else { st.qi = qi + 1; } save(); render(); } }, last ? 'See the result →' : 'Next →')) : null);
}

function scoreOf(X, st){ return X.mc.reduce(function(s, q, i){ return s + (st.answers[i] === q.a ? 1 : 0); }, 0); }

function stepResult(X, st){
  const sc = scoreOf(X, st);
  const review = X.mc.map(function(q, i){
    const ok = st.answers[i] === q.a;
    return h('div', { class:'rev' },
      h('span', { class:'m', style:'color:' + (ok ? '#3DDC84' : '#FF4A2E') }, ok ? '✓' : '✗'),
      h('span', {}, h('strong', {}, (i + 1) + '. '), q.q, h('br'), h('span', { class:'mute' }, q.why)));
  });
  return h('div', { class:'card' }, segs('esito'),
    h('div', { class:'mono mute' }, 'Step 5 of 5 · Esito'),
    h('div', { class:'bigscore' }, sc, h('span', { style:'font-size:28px;color:#A9A6B4' }, ' / ' + X.mc.length)),
    h('p', { class:'mute', style:'margin:0;font-size:14px' }, 'This number isn\'t a skill score. It shows where the reading broke. Skim the notes below, then file it.'),
    review,
    h('div', { class:'row' },
      h('button', { class:'btn', onclick:function(){ st.filed = true; st.filedAt = new Date().toISOString(); st.score = sc; save(); render(); knock(); burst(); } }, 'File it in the archive'),
      h('button', { class:'btn alt', onclick:function(){ st.step = 'domande'; st.qi = 0; save(); render(); } }, 'Review the questions')));
}

function filedPanel(X, st){
  const mine = X.analysis.map(function(f){
    return h('div', {}, h('div', { class:'mono mute', style:'margin-bottom:6px' }, f.label),
      h('div', { class:'cmp' },
        h('div', {}, h('div', { class:'mono mute', style:'margin-bottom:4px;font-size:10px' }, 'Yours'), st.analysis[f.k]),
        h('div', { class:'m2' }, h('div', { class:'mono', style:'margin-bottom:4px;font-size:10px;color:#FFC83D' }, 'Model'), X.model[f.k])));
  });
  return h('div', { class:'card' },
    h('div', { style:'display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap' },
      h('span', { class:'mono mute' }, 'Prova n. ' + pad(X.n) + ' · ' + X.type), h('span', { class:'stamp' }, 'DEPOSITATA ' + fmtDate(st.filedAt))),
    h('div', { class:'big' }, 'Filed. ' + st.score + ' / ' + X.mc.length + ' on the questions.'),
    h('p', { class:'mute', style:'margin:0;font-size:14px' }, 'It\'s in your archive and the hearing can use it. Compare your breakdown with the model: they don\'t need to match, but they should hit the same four points.'),
    mine,
    vocabReview(X, st),
    h('div', { class:'row' }, h('a', { class:'btn', href:'#/udienza' }, 'Run the hearing'), h('a', { class:'btn alt', href:'#/' }, 'Back to today')));
}

function viewProva(id){
  const X = EXHIBITS.find(function(e){ return e.id === id; });
  if (!X) return h('main', {}, h('p', {}, 'Prova not found. '), h('a', { href:'#/' }, 'Back'));
  const st = ex(id);
  let right;
  if (st.filed) right = filedPanel(X, st);
  else if (st.step === 'leggi') right = stepRead(X, st);
  else if (st.step === 'vocab') right = stepVocab(X, st);
  else if (st.step === 'analisi') right = stepAnalysis(X, st);
  else if (st.step === 'domande') right = stepQuestions(X, st);
  else right = stepResult(X, st);
  return h('main', {},
    h('div', { style:'margin:10px 0 16px' }, h('a', { href:'#/', class:'mono', style:'text-decoration:none' }, '← Today')),
    h('div', { class:'prova' }, h('div', { class:'l' }, readingPane(X, st)), h('div', { class:'r' }, right)));
}

/* ============================================================
   VIEW: UDIENZA RAPIDA  (5 questions + 3 chunks, once a day)
   ============================================================ */
let U = null;
function buildDeck(){
  const qs = [], cs = [];
  filedList().forEach(function(X){
    X.mc.forEach(function(q){ qs.push(q); });
    X.vocab.forEach(function(c){ cs.push(c); });
  });
  const picked = shuffle(qs).slice(0, 5).map(function(q){
    const o = shuffle(q.o.map(function(t, i){ return { t:t, i:i }; }));
    return { q:q.q, why:q.why, o:o, a:q.a };
  });
  return { qs:picked, cs:shuffle(cs).slice(0, 3), i:0, right:0, got:0, phase:'q', chosen:null, flipped:false };
}
function finishHearing(){
  const t = new Date(), today = ymd(t), H = S.hearings;
  if (H.last !== today){
    H.streak = (H.last === ymd(prevSchoolDay(t))) ? H.streak + 1 : 1;
    H.last = today; H.count++;
    H.lastScore = U.right + ' / ' + U.qs.length + ' + ' + U.got + ' / ' + U.cs.length + ' chunks';
    save();
  }
}
function nextChunk(){
  U.flipped = false;
  if (U.i + 1 < U.cs.length){ U.i++; }
  else { U.phase = 'done'; finishHearing(); render(); knock(); burst(); return; }
  render();
}
function viewUdienza(){
  if (!filedList().length){
    return h('main', {}, h('div', { class:'card', style:'margin-top:20px' }, h('h2', { style:'font-size:32px' }, 'Nothing filed yet.'),
      h('p', { class:'mute', style:'margin:0' }, 'The hearing only uses prove you\'ve already analyzed and filed.'), h('div', { class:'row', style:'margin-top:0' }, h('a', { class:'btn', href:'#/prova/p01' }, 'Go to Prova n. 01'))));
  }
  if (!U) U = buildDeck();
  const segsRow = h('div', { class:'segs' }, U.qs.map(function(_, k){ return h('i', { class: (U.phase !== 'q' || k < U.i || (k === U.i && U.chosen !== null)) ? 'on' : '' }); }).concat(U.cs.map(function(_, k){ return h('i', { class: (U.phase === 'done' || (U.phase === 'c' && k < U.i)) ? 'on' : '' }); })));
  let body;
  if (U.phase === 'q'){
    const Q = U.qs[U.i], answered = U.chosen !== null;
    const opts = Q.o.map(function(op, k){
      let cls = 'opt';
      if (answered){ if (op.i === Q.a) cls += ' good'; else if (k === U.chosen) cls += ' bad'; }
      return h('button', { class:cls, disabled:answered, onclick:function(){ U.chosen = k; if (Q.o[k].i === Q.a){ U.right++; knock(); } render(); } }, h('b', {}, LETTERS[k]), h('span', {}, op.t));
    });
    body = h('div', { class:'card' }, segsRow, h('div', { class:'mono mute' }, 'Question ' + (U.i + 1) + ' of ' + U.qs.length), h('div', { class:'stem' }, Q.q), h('div', { class:'stack', style:'gap:10px' }, opts),
      answered ? h('div', { class:'why', role:'status' }, Q.why) : null,
      answered ? h('div', { class:'row' }, h('button', { class:'btn', onclick:function(){ U.chosen = null; if (U.i + 1 < U.qs.length){ U.i++; } else { U.phase = 'c'; U.i = 0; U.flipped = false; } render(); } }, 'Next →')) : null);
  } else if (U.phase === 'c'){
    const C = U.cs[U.i];
    body = h('div', { class:'card' }, segsRow, h('div', { class:'mono mute' }, 'Chunk ' + (U.i + 1) + ' of ' + U.cs.length),
      h('button', { class:'flip', 'aria-label': U.flipped ? 'Meaning: ' + C.en : 'Show meaning of ' + C.it, onclick:function(){ U.flipped = true; render(); } },
        h('span', {}, U.flipped ? C.en : C.it, h('small', {}, U.flipped ? 'MEANING' : 'TAP TO FLIP'))),
      U.flipped ? h('div', { class:'row' },
        h('button', { class:'btn', onclick:function(){ U.got++; nextChunk(); } }, 'Knew it'),
        h('button', { class:'btn alt', onclick:function(){ nextChunk(); } }, 'Review again')) : null);
  } else {
    body = h('div', { class:'card' }, segsRow, h('div', { class:'mono mute' }, 'Udienza chiusa'),
      h('div', { class:'bigscore' }, U.right, h('span', { style:'font-size:28px;color:#A9A6B4' }, ' / ' + U.qs.length)),
      h('p', { style:'margin:0' }, 'Chunks you knew: ' + U.got + ' / ' + U.cs.length + '. Streak: ' + streakNow() + '.'),
      h('div', { class:'row' }, h('a', { class:'btn', href:'#/' }, 'Back to today')));
  }
  return h('main', {}, h('div', { style:'margin:10px 0 16px' }, h('a', { href:'#/', class:'mono', style:'text-decoration:none' }, '← Today')),
    h('div', { class:'hello', style:'margin-top:0' }, h('h1', {}, 'Udienza rapida'), doneToday() && U.phase !== 'done' ? h('span', { class:'mono mute' }, 'Already done today · streak counts once') : null),
    h('div', { style:'max-width:720px' }, body));
}

/* ============================================================
   ROUTER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  const route = currentRoute();
  let view;
  if (route.indexOf('/prova/') === 0) view = viewProva(route.slice(7));
  else if (route === '/udienza') view = viewUdienza();
  else if (route === '/skills') view = viewSkills();
  else if (route === '/archivio') view = viewArchivio();
  else view = viewOggi();
  app.replaceChildren.apply(app, topbar().concat([tabs(), view]).filter(Boolean));
}
/* in-page navigation: works in a normal tab AND inside preview windows where #links can fail */
document.addEventListener('click', function(e){
  const a = e.target && e.target.closest ? e.target.closest('a[href^="#/"]') : null;
  if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || a.getAttribute('target') === '_blank') return;
  e.preventDefault();
  go(a.getAttribute('href').slice(1));
});
window.addEventListener('hashchange', function(){
  ROUTE = (location.hash || '#/').replace(/^#/, '') || '/';
  if (ROUTE !== '/udienza') U = null;
  render(); window.scrollTo(0, 0);
});
render();
</script>
</body>
