<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0D11">
<title>Studio Legale · AP Italian</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0D11; --surf:#17171E; --surf2:#22222C; --line:#33333F;
  --text:#F6F4EE; --mute:#A9A6B4; --paper:#F6F4EE; --ink:#0D0D11;
  --acid:#C8FF3D; --acid-d:#8DB81C; --hot:#FF4A2E; --hot-d:#B8301B; --gold:#FFC83D;
  --good:#3DDC84; --bad:#FF4A2E;
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;padding-bottom:88px;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:var(--acid)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.02}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.mute{color:var(--mute)}

/* header + nav */
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;flex-wrap:wrap}
.top .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.top .grow{flex-grow:1}
.top input{font:500 14px var(--sans);padding:8px 12px;min-height:40px;border:2px solid var(--line);border-radius:12px;background:var(--surf);color:var(--text);width:150px}
.top input::placeholder{color:#7C7A86}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:8px 12px;min-height:40px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--mute)}
.chip.on{border-color:var(--acid);color:var(--acid)}
nav.tabs{order:1;position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(13,13,17,.94);backdrop-filter:blur(10px);border-top:2px solid var(--line)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;min-height:52px;border-radius:14px;text-decoration:none;color:var(--mute);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
nav.tabs a.on{color:var(--ink);background:var(--acid)}
nav.tabs svg{width:22px;height:22px;fill:currentColor}
main{order:2;width:100%;max-width:1060px;margin:0 auto;padding:8px 20px 40px}
.alert{background:var(--hot);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:14px;font-weight:500}
.alert button{background:#fff;color:var(--hot-d);border:0;border-radius:10px;padding:8px 14px;min-height:40px;font-weight:700}
@media (min-width:901px){
  body{padding-bottom:0}
  nav.tabs{position:static;order:1;background:transparent;backdrop-filter:none;border-top:0;max-width:1060px;width:100%;margin:0 auto;padding:0 20px 8px}
  nav.tabs a{flex:0 0 auto;flex-direction:row;gap:8px;padding:10px 18px;min-height:44px;font-size:11px}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 16px var(--sans);padding:14px 22px;min-height:52px;border-radius:16px;border:0;border-bottom:5px solid var(--acid-d);background:var(--acid);color:var(--ink);text-decoration:none;transition:transform .08s,border-bottom-width .08s}
.btn:active{transform:translateY(4px);border-bottom-width:1px}
.btn.alt{background:var(--surf2);color:var(--text);border-bottom-color:#12121a}
.btn.hot{background:var(--hot);color:#fff;border-bottom-color:var(--hot-d)}
.btn.ghost{background:transparent;border:2px solid var(--line);border-bottom-width:2px;color:var(--text)}
.btn.sm{min-height:44px;padding:10px 16px;font-size:14px;border-radius:12px;border-bottom-width:4px}
.btn[disabled]{background:var(--surf2);border-bottom-color:var(--surf2);color:#7C7A86;cursor:not-allowed}
.btn[disabled]:active{transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}

/* cards */
.card{background:var(--surf);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--line)}
.card.acid{background:var(--acid);color:var(--ink);border-color:var(--acid)}
.card.acid .mute{color:#3b4a0c}
.card.hot{background:var(--hot);border-color:var(--hot);color:#fff}
.card.paper{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.hello{margin:18px 0 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hello h1{font-size:clamp(34px,6vw,58px)}
.streak{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--surf);border:2px solid var(--line);font-family:var(--display);font-weight:800;font-size:20px}
.streak svg{width:20px;height:20px;fill:var(--gold)}
.streak.cold svg{fill:#55535f}
.big{font-family:var(--display);font-weight:800;letter-spacing:-.03em;line-height:.98;font-size:clamp(28px,5vw,44px)}

/* path */
.path{position:relative;display:flex;justify-content:space-between;gap:6px;padding:6px 4px}
.path::before{content:'';position:absolute;left:24px;right:24px;top:28px;height:4px;background:var(--line);border-radius:2px}
.node{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px;background:var(--surf2);color:#7C7A86;border:3px solid var(--bg);text-decoration:none}
.node.done{background:var(--acid);color:var(--ink)}
.node.now{background:var(--bg);color:var(--acid);border:3px solid var(--acid);animation:pulse 1.8s infinite}
.node svg{width:22px;height:22px;fill:var(--ink)}
.pathlbl{display:flex;justify-content:space-between;margin-top:6px}

/* skills */
.skill{background:var(--surf);border-radius:18px;padding:14px;border:2px solid var(--line);display:flex;flex-direction:column;gap:10px;min-height:96px;justify-content:space-between}
.bar{height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.bar>div{height:8px;background:var(--acid);border-radius:4px}
.chart{background:#fff;color:#0D0D11;border-radius:10px;padding:14px}
.chart .ct{font-weight:600;font-size:14px;margin-bottom:10px}
.chart .cr{display:grid;grid-template-columns:56px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.chart .cb{height:16px;background:#E8E6EF;border-radius:3px;overflow:hidden}
.chart .cb>div{height:16px;background:#3B2FD9}
.chart .cn{font-size:12px;color:#55535f;margin-top:8px}
.skill .bar{height:8px;background:var(--surf2);border-radius:4px;overflow:hidden}
.skill .bar>div{height:8px;background:var(--acid);border-radius:4px}
.skill.done{border-color:var(--acid)}
.skill .t{font-size:14px;font-weight:500;line-height:1.3}

/* prove */
.prova{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.prova>.l{flex:1 1 440px;min-width:0}.prova>.r{flex:1 1 440px;min-width:0}
.reading .intro{font-size:14px;color:#55535f;line-height:1.55;font-style:italic}
.reading .body p{font:400 17px/1.75 var(--sans);margin:0 0 14px}
.reading mark{background:#C8FF3D;color:#0D0D11;border-radius:3px;padding:1px 2px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.reading .hlbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 16px;padding:10px 12px;background:#efece3;border-radius:10px;position:sticky;top:0;z-index:2}
.reading .hlbar .mute{color:#55535f}
.hlpanel{border:1px dashed var(--line,#3a3a44);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.hlpanel mark{background:#C8FF3D;color:#0D0D11;border-radius:3px;padding:1px 3px}
.hlpanel li{margin:0 0 8px;font-size:14px;line-height:1.5}
.reading a.btn{align-self:flex-start}
.segs{display:flex;gap:6px;margin-bottom:6px}
.segs i{flex:1;height:8px;border-radius:4px;background:var(--surf2)}
.segs i.on{background:var(--acid)}
textarea{width:100%;font:400 17px/1.6 var(--sans);padding:16px;border:2px solid var(--line);border-radius:16px;background:var(--surf2);color:var(--text);resize:vertical;min-height:130px}
.reading textarea{background:#fff;color:var(--ink);border-color:#d9d6cd}
textarea:focus{border-color:var(--acid);outline:0}
.field label{display:block;font-family:var(--display);font-weight:800;font-size:20px;margin-bottom:2px}
.field .hint{font-size:13px;color:var(--mute);margin:0 0 8px}
.field .cnt{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:6px}
.stem{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.4vw,26px);line-height:1.2;letter-spacing:-.01em}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:16px;background:var(--surf2);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;font:500 16px/1.4 var(--sans);color:var(--text);min-height:56px;transition:transform .08s}
.opt b{font-family:var(--mono);font-weight:700;width:22px;flex-shrink:0;color:var(--acid)}
.opt:hover:not([disabled]){border-color:var(--acid)}
.opt:active:not([disabled]){transform:translateY(3px);border-bottom-width:2px}
.opt.good{background:#12301f;border-color:var(--good);animation:pop .35s}
.opt.bad{background:#3a140d;border-color:var(--bad);animation:shake .4s}
.opt[disabled]{cursor:default}
.why{border-radius:16px;background:var(--surf2);border-left:6px solid var(--gold);padding:14px 16px;font-size:15px;animation:rise .3s}
.why strong{color:var(--gold)}
.stamp{display:inline-block;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--hot);border:3px solid var(--hot);border-radius:8px;padding:6px 10px;transform:rotate(-4deg);animation:slam .5s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.card.acid .stamp,.card.paper .stamp{color:var(--hot-d);border-color:var(--hot-d)}
.bigscore{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;letter-spacing:-.04em}
.rev{display:flex;gap:12px;padding:12px 0;border-top:2px solid var(--line);font-size:14px}
.opt.sel{border-color:var(--acid);color:var(--acid)}
.pprprint{display:none}
@media print{
  body *{visibility:hidden}
  .pprprint,.pprprint *{visibility:visible}
  .pprprint{display:block;position:absolute;left:0;top:0;width:100%;background:#fff;color:#000;padding:24px}
}
.crit{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:2px solid var(--line);font-size:14px}
.crit .cb{display:flex;gap:8px}
.rev .m{font-family:var(--mono);font-weight:700;width:22px;flex-shrink:0}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp>div{border-radius:14px;padding:12px;font-size:14px;line-height:1.5;background:var(--surf2)}
.cmp>div.m2{background:#2a2410;border:2px solid var(--gold)}
.flip{min-height:240px;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--acid);color:var(--ink);border:0;border-bottom:6px solid var(--acid-d);border-radius:24px;font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);letter-spacing:-.02em;line-height:1.05}
.flip small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;margin-top:14px;opacity:.7;font-weight:500}
.vcell{display:flex;flex-direction:column;gap:6px}
.vcard{width:100%;min-height:120px;padding:14px;border-radius:18px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surf2);color:var(--text);font:700 18px/1.2 var(--display);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .08s}
.vcard.en{background:var(--acid);color:var(--ink);border-color:var(--acid);border-bottom-color:var(--acid-d)}
.vcard .ex{font:italic 400 13px/1.4 var(--sans)}
.vcard small{font-family:var(--mono);font-size:10px;letter-spacing:.08em;opacity:.7;font-weight:500}
.vcard:active{transform:translateY(3px);border-bottom-width:2px}
.ring{position:relative;width:96px;height:96px;flex-shrink:0}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:22px}
.conf{position:fixed;left:50%;top:40%;z-index:50;pointer-events:none}
.conf span{position:absolute;width:10px;height:14px;border-radius:2px;animation:conf 1.1s ease-out forwards}
@keyframes slam{0%{transform:scale(2.6) rotate(-14deg);opacity:0}60%{transform:scale(.9) rotate(-3deg);opacity:1}100%{transform:scale(1) rotate(-4deg)}}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,255,61,.5)}50%{box-shadow:0 0 0 10px rgba(200,255,61,0)}}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.cmp{grid-template-columns:1fr}.top input{width:120px}}
</style>
</head>

<script>
'use strict';

/* ============================================================
   CONTENT — add new exhibits to EXHIBITS, new descriptors to
   DESCRIPTORS. Nothing else needs to change.
   Copyright rule: article text is NEVER stored in this file.
   Students open the original (url) or paste the text locally.
   ============================================================ */

/* The six thematic units of the 2027 AP Italian framework (any order). n = study order here; unit = College Board unit number.
   Study order is a draft. Dates are not set until the calendar is decided. */
const CASES = [
  { n:1, unit:5, name:'Vita contemporanea',    en:'Contemporary Life',        color:'#FFA94D', opens:'TBD', open:true },
  { n:2, unit:3, name:'Arte e creatività',     en:'Art and Creativity (2026–27 project theme: music)', color:'#E070FF', opens:'TBD' },
  { n:3, unit:1, name:'Famiglie e comunità',   en:'Families and Communities', color:'#3DDC84', opens:'TBD' },
  { n:4, unit:2, name:'Lingua e cultura',      en:'Language and Culture',     color:'#7C8CFF', opens:'TBD' },
  { n:5, unit:4, name:'Scienza e tecnologia',  en:'Science and Technology',   color:'#3DD6E0', opens:'TBD' },
  { n:6, unit:6, name:'Contesti globali',      en:'Global Contexts',          color:'#D9A066', opens:'TBD' }
];

/* 2027 free-response skills. Rows are taken from the College Board's exam-overview directions for Q1 and Q2 (paraphrased),
   NOT from official scoring rubrics. The Q3 essay group is added once the official 2027 rubric is in hand.
   The old email-reply / conversation / cultural-comparison groups were retired: those tasks are not on the 2027 exam. */
const DESCRIPTORS = [
  { task:'Presentazione del progetto', meta:'Q1 · 3 min · 20%', items:['Addresses the prompt fully, with the required factors','Specific examples linking perspectives to products and practices','Logical organization, with transitions','Varied vocabulary, structures, culturally appropriate expressions','Clear delivery: natural pace, intonation, pronunciation'] },
  { task:'Domande sul progetto', meta:'Q2 · 4 × 40 s · 15%', items:['Complete, relevant answer to each question','Cultural comparison or reflection in at least one answer','Clear, natural speech with varied language'] },
  { task:'Saggio argomentativo', meta:'Q3 · 55 min · 15%', items:['A clearly stated position','Evidence from all three sources, identified by source','Claims explained with the evidence','Logical organization and transitions','Varied vocabulary, structures, expressions'] }
];

const EXHIBITS = [
  {
    id:'p01', caso:1, n:1, type:'LETTURA',
    title:'Adolescenti e social, il paradosso di una generazione: riconoscono i rischi, ma hanno paura di dire no',
    short:'I rischi online? Li riconoscono. Dire no? Non ci riescono.',
    author:'Francesco Pira, sociologo, Università di Messina · QdS (Quotidiano di Sicilia), 16 ottobre 2026',
    intro:"Il seguente articolo di Francesco Pira, professore di Sociologia all'Università di Messina, pubblicato sul Quotidiano di Sicilia (QdS) il 16 ottobre 2026, commenta i risultati della Survey Teen 2026 su adolescenti e social network (Ipsos Doxa per Fondazione Libellula).",
    url:'https://qds.it/adolescenti-social-paradosso-generazione-riconoscono-rischi-ma-hanno-paura-di-dire-no/',
    minutes:45,
    email:{
      from:'Elena Marchetti · coordinatrice, programma di scambio «Ponte Italia»',
      subject:'Giovani e social: la sua opinione per il nostro incontro',
      body:[
        'Gentile studentessa,',
        "Le scrivo a nome del programma di scambio «Ponte Italia», che collega la sua scuola a un liceo di Messina. Il mese prossimo organizziamo un incontro online tra studenti italiani e americani sul tema «Giovani e social network».",
        "Una recente ricerca italiana mostra che molti adolescenti riconoscono i rischi dei social, ma hanno difficoltà a dire di no quando il gruppo la pensa diversamente. Vorremmo sapere come vivono questa situazione i ragazzi americani.",
        'Le chiedo quindi due cose:'
      ],
      asks:[
        'Quali problemi osserva tra i suoi coetanei quando usano i social e perché, secondo lei, è difficile prendere posizione davanti agli amici?',
        'In che modo la scuola potrebbe aiutare i ragazzi a sentirsi meno soli online?'
      ],
      close:["Mi risponda entro venerdì, per favore. La ringrazio fin d'ora per la collaborazione.", 'Cordiali saluti,', 'Elena Marchetti'],
      phrases:[
        { h:'Greeting',            l:['Gentile Dottoressa Marchetti,', 'Egregia Dottoressa,'] },
        { h:'Opening',             l:['La ringrazio per la Sua email.', 'Le scrivo in risposta alla Sua richiesta.'] },
        { h:'Answering',           l:['Per quanto riguarda la prima domanda, …', 'A mio parere, …', 'In primo luogo, …', 'Inoltre, …'] },
        { h:'Reasons + examples',  l:['Il motivo è che …', 'Per esempio, …', 'Infatti, …'] },
        { h:'Asking back',         l:['Vorrei sapere se …', "Potrebbe dirmi a che ora si terrà l'incontro?", 'Sarebbe possibile avere maggiori informazioni su …?'] },
        { h:'Closing',             l:['Spero di aver risposto alle Sue domande.', 'Resto a disposizione per qualsiasi chiarimento.', 'In attesa di una Sua risposta,', 'Cordiali saluti,'] }
      ],
      task:'Reply to Dott.ssa Marchetti. Greet her formally, answer both questions with reasons and examples, ask her for one detail about the meeting, and close politely. Use Lei.'
    },
    analysis:[
      { k:'tesi',     label:'Tesi',            hint:"Cosa sostiene l'autore? Una frase, con parole tue." },
      { k:'prove',    label:'Prove',           hint:"Quali dati o esempi usa per sostenerla? Cita almeno due numeri." },
      { k:'registro', label:'Registro',        hint:"Che tono ha? A chi parla? (genitori, insegnanti, giovani…)" },
      { k:'lente',    label:'Lente culturale', hint:"Cosa rivela sull'Italia o sui giovani italiani?" }
    ],
    model:{
      tesi:"I giovani riconoscono stereotipi e modelli tossici online, ma senza una rete di sostegno non riescono a prendere posizione quando il problema coinvolge il proprio gruppo di amici.",
      prove:"Dati della Survey Teen 2026: l'85% ha visto gelosia e controllo presentati come normali, il 92% contenuti che svalutano le ragazze, l'89% modelli «alpha» o «sigma»; il 48% modifica le proprie immagini; il 38% si sente solo.",
      registro:"Formale e divulgativo: un sociologo cita ricerche e studiosi (Bourdieu, Goffman) e si rivolge a un pubblico adulto, cioè scuole e famiglie, con un tono di appello più che di accusa.",
      lente:"Mostra una società in cui scuola e famiglia restano i luoghi educativi centrali: la famiglia è ancora il «principale riferimento emotivo», ma la solitudine e la pressione del gruppo pesano soprattutto sulle ragazze."
    },
    vocab:[
      { it:'prendere posizione',                  en:'to take a stand',                      ex:"Quando un amico dice qualcosa di ingiusto, è difficile prendere posizione." },
      { it:'il costo sociale del dissenso',       en:'the social cost of disagreeing',       ex:"Molti tacciono perché temono il costo sociale del dissenso." },
      { it:'una rete di sostegno',                en:'a support network',                    ex:"Senza una rete di sostegno, nessuno trova il coraggio di parlare." },
      { it:'sottrarsi alla pressione del gruppo', en:'to escape peer pressure',              ex:"Per un adolescente è difficile sottrarsi alla pressione del gruppo." },

function knock(){
  try { if (navigator.vibrate) navigator.vibrate(12); } catch(e) {}
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    [0, 0.11].forEach(function(d){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(190, t + d);
      o.frequency.exponentialRampToValueAtTime(70, t + d + 0.09);
      g.gain.setValueAtTime(0.5, t + d);
      g.gain.exponentialRampToValueAtTime(0.001, t + d + 0.12);

/* ---- v2.3 highlighter: ranges are {p, s, e} = paragraph index + character offsets ---- */
var lastSel = null;
function parasOf(st){ return (st.localText || '').split(/\n+/).map(function(s){ return s.trim(); }).filter(Boolean); }
function mergedHl(st, p){
  const r = (st.hl || []).filter(function(x){ return x.p === p; }).map(function(x){ return [x.s, x.e]; }).sort(function(a, b){ return a[0] - b[0]; });
  const out = [];
  r.forEach(function(x){
    const last = out[out.length - 1];
    if (last && x[0] <= last[1]) last[1] = Math.max(last[1], x[1]); else out.push([x[0], x[1]]);
  });
  return out;
}
function setHl(st, p, ranges){
  st.hl = (st.hl || []).filter(function(x){ return x.p !== p; }).concat(ranges.map(function(x){ return { p:p, s:x[0], e:x[1] }; }));
}
function readSelection(){
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
  const rg = sel.getRangeAt(0);
  const els = document.querySelectorAll('.reading .body p[data-p]');
  const out = [];
  els.forEach(function(el){
    const pr = document.createRange();
    pr.selectNodeContents(el);
    const a = pr.comparePoint(rg.startContainer, rg.startOffset);
    const b = pr.comparePoint(rg.endContainer, rg.endOffset);
    if (a > 0 || b < 0) return;
    const len = el.textContent.length;
    let s = 0, e = len, t;
    if (a >= 0){ t = document.createRange(); t.setStart(el, 0); t.setEnd(rg.startContainer, rg.startOffset); s = t.toString().length; }
    if (b <= 0){ t = document.createRange(); t.setStart(el, 0); t.setEnd(rg.endContainer, rg.endOffset); e = t.toString().length; }
    if (e - s > 0) out.push({ p:Number(el.getAttribute('data-p')), s:s, e:e });
  });
  return out.length ? out : null;
}
if (!window.__hlBound){
  window.__hlBound = true;
  document.addEventListener('selectionchange', function(){
    const found = readSelection();
    if (!found) return;               /* keep the last good selection: tapping the button can clear it on phones */
    lastSel = found;
    const note = document.getElementById('hl-status');
    if (note) note.textContent = 'Selection ready. Tap "Highlight selection".';
  });
}
function hlParagraph(st, text, i){
  const marks = mergedHl(st, i);
  const kids = [];
  let pos = 0;
  marks.forEach(function(m){
    if (m[0] > pos) kids.push(text.slice(pos, m[0]));
    kids.push(h('mark', { title:'Tap to remove', onclick:function(){ setHl(st, i, marks.filter(function(x){ return x !== m; })); save(); render(); } }, text.slice(m[0], m[1])));
    pos = m[1];
  });
  if (pos < text.length) kids.push(text.slice(pos));
  return h('p', { 'data-p':String(i) }, kids);
}
function hlSnippets(st){
  const paras = parasOf(st), out = [];
  for (let i = 0; i < paras.length; i++){
    mergedHl(st, i).forEach(function(m){ out.push(paras[i].slice(m[0], m[1])); });
  }
  return out;
}

function readingPane(X, st){
  lastSel = null;
  if (!st.hl) st.hl = [];
  const paras = parasOf(st);
  const ta = h('textarea', { 'aria-label':"Incolla qui il testo dell'articolo", placeholder:"Incolla qui il testo dell'articolo…", style:'min-height:220px' });
  ta.value = st.localText || '';
  const fileIn = h('input', { type:'file', accept:'.txt,text/plain', style:'display:none', 'aria-label':'Load article text file' });
  fileIn.addEventListener('change', function(){
    const f = fileIn.files && fileIn.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = function(){ st.localText = String(rd.result || ''); st.hl = []; save(); render(); };
    rd.readAsText(f);
  });
  const body = paras.length
    ? h('div', { class:'body' },
        h('div', { class:'hlbar' },
          h('button', { class:'btn sm', onclick:function(){
            const s = lastSel;
            const note = document.getElementById('hl-status');
            if (!s){ if (note) note.textContent = 'Select some words in the text first, then tap this.'; return; }
            const byP = {};
            s.forEach(function(x){ (byP[x.p] = byP[x.p] || []).push([x.s, x.e]); });
            Object.keys(byP).forEach(function(k){
              const p = Number(k);
              setHl(st, p, mergedHl(st, p).concat(byP[k]).sort(function(a, b){ return a[0] - b[0]; }));
              const m = mergedHl(st, p); setHl(st, p, m);
            });
            lastSel = null;
            try { window.getSelection().removeAllRanges(); } catch (e) {}
            save(); render();
          } }, 'Highlight selection'),
          h('span', { id:'hl-status', class:'mute', style:'font-size:13px' }, 'Select the key sentences, then tap the button. Tap a highlight to remove it.')),
        paras.map(function(p, i){ return hlParagraph(st, p, i); }),
        h('div', { class:'row' },
          h('button', { class:'btn alt sm', onclick:function(){ st.localText = ''; st.hl = []; save(); render(); } }, 'Clear pasted text'),
          (st.hl.length ? h('button', { class:'btn alt sm', onclick:function(){ st.hl = []; save(); render(); } }, 'Remove all highlights') : null)))
    : h('div', {},
        h('p', { style:'font-size:14px;color:#55535f;margin:0 0 10px' }, "If the link is blocked at school, your teacher gives you the text: paste it in the box below, or load the .txt file she shares, then tap Show. It saves only on this device. (This tool doesn't hold the article itself because it's copyrighted.)"),
        ta,
        h('div', { class:'row' },
          h('button', { class:'btn alt sm', style:'background:#0D0D11;color:#fff', onclick:function(){ st.localText = ta.value; st.hl = []; save(); render(); } }, 'Show the text here'),
          h('button', { class:'btn alt sm', onclick:function(){ fileIn.click(); } }, 'Load a .txt file'),
          fileIn));
  return h('div', { class:'card paper reading' },
    h('div', { class:'mono', style:'color:#55535f' }, 'Fonte n. 1 · ' + X.type),
    h('div', { class:'intro' }, X.intro),
    h('h2', { style:'font-size:26px;line-height:1.1' }, X.title),
    h('div', { style:'font-size:13px;color:#55535f' }, X.author),
    X.url ? h('a', { class:'btn sm', style:'background:#0D0D11;color:#C8FF3D;border-bottom-color:#000', href:X.url, target:'_blank', rel:'noopener' }, 'Open the original ↗') : h('div', { class:'mono', style:'color:#8A6A14' }, '[LINK TO ORIGINAL: add "url" in EXHIBITS]'),
    body);
}

function softGate(btn, ok, okLabel){ btn.removeAttribute('disabled'); btn.textContent = ok ? okLabel : 'Skip for now →'; btn.classList.toggle('alt', !ok); }
function okSentence(t){ t = (t || '').trim(); return t.length >= 20 && t.split(/\s+/).length >= 4; }

function stepVocab(X, st){
  st.sentences = st.sentences || {};
  st.known = st.known || {};
  const knownTxt = h('span', { class:'mono mute' });
  function updKnown(){ knownTxt.textContent = Object.keys(st.known).filter(function(k){ return st.known[k]; }).length + ' / ' + X.vocab.length + ' marked as known'; }
  updKnown();
  const cells = X.vocab.map(function(v, i){
    let showEn = false;
    const side = h('span', {}, v.it);
    const exl = h('span', { class:'ex', style:'display:none' }, '«' + v.ex + '»');
    const hint = h('small', {}, 'TAP FOR MEANING');
    const card = h('button', { class:'vcard', 'aria-label':'Flip card: ' + v.it }, side, exl, hint);
    card.addEventListener('click', function(){
      showEn = !showEn;
      side.textContent = showEn ? v.en : v.it;
      exl.style.display = showEn ? 'block' : 'none';
      hint.textContent = showEn ? 'TAP FOR ITALIAN' : 'TAP FOR MEANING';
      card.classList.toggle('en', showEn);
    });
    const chip = h('button', { class:'chip' + (st.known[i] ? ' on' : ''), 'aria-pressed':st.known[i] ? 'true' : 'false' }, st.known[i] ? 'KNOWN ✓' : 'MARK AS KNOWN');
    chip.addEventListener('click', function(){
      st.known[i] = !st.known[i]; save();
      chip.classList.toggle('on', !!st.known[i]);
      chip.setAttribute('aria-pressed', st.known[i] ? 'true' : 'false');
      chip.textContent = st.known[i] ? 'KNOWN ✓' : 'MARK AS KNOWN';
      updKnown();
    });
    return h('div', { class:'vcell' }, card, chip);
  });
  const btn = h('button', { class:'btn alt' }, 'On to the breakdown →');
  function ready(){ return X.write.every(function(w){ return okSentence(st.sentences[w.i]); }); }
  function refresh(){ softGate(btn, ready(), 'On to the breakdown →'); }
  btn.addEventListener('click', function(){ st.step = 'analisi'; save(); render(); });
  const fields = X.write.map(function(w, k){
    const v = X.vocab[w.i];
    const id = 's-' + w.i;
    const cnt = h('div', { class:'cnt' });
    const ta = h('textarea', { id:id, 'aria-describedby':id + '-h', style:'min-height:96px' });
    ta.value = st.sentences[w.i] || '';
    function upd(){ cnt.textContent = okSentence(ta.value) ? 'Good length' : 'Write a full sentence: at least 4 words'; }
    ta.addEventListener('input', function(){ st.sentences[w.i] = ta.value; save(); upd(); refresh(); });
    upd();
    return h('div', { class:'field' }, h('label', { for:id }, (k + 1) + '. ' + v.it), h('p', { class:'hint', id:id + '-h' }, w.hint), ta, cnt);
  });
  refresh();
  return h('div', { class:'card' }, segs('vocab'),
    h('div', { class:'mono mute' }, 'Step 2 of 5 · Vocabolario'),
    h('h2', { style:'font-size:32px' }, 'Learn the chunks. Then use them.'),
    h('p', { class:'mute', style:'margin:0;font-size:14px' }, 'Twelve phrases from the article. Tap a card to see the meaning and an example. Learn whole phrases, not single words.'),
    h('div', { style:'display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px' }, cells),
    knownTxt,
    h('h2', { style:'font-size:26px;margin-top:10px' }, 'Now make your own sentences'),
    h('p', { class:'mute', style:'margin:0;font-size:14px' }, 'Six chunks, six sentences about your own life. In Italian. You can change the verb ending, but keep the phrase.'),
    fields, h('div', { class:'row' }, btn));
}

function stepQuestions(X, st){
  const qi = Math.min(st.qi || 0, X.mc.length - 1);
  const Q = X.mc[qi];
  const chosen = st.answers[qi];
  const answered = chosen !== undefined && chosen !== null;
  const opts = Q.o.map(function(t, i){
    let cls = 'opt';
    if (answered){ if (i === Q.a) cls += ' good'; else if (i === chosen) cls += ' bad'; }
    return h('button', { class:cls, disabled:answered, onclick:function(){ st.answers[qi] = i; save(); if (i === Q.a) knock(); render(); } }, h('b', {}, LETTERS[i]), h('span', {}, t));
  });
  const last = qi === X.mc.length - 1;
  return h('div', { class:'card' }, segs('domande'),
    h('div', { class:'mono mute' }, 'Step 4 of 5 · Question ' + (qi + 1) + ' of ' + X.mc.length),
    h('div', { class:'stem' }, Q.q), h('div', { class:'stack', style:'gap:10px' }, opts),
    answered ? h('div', { class:'why', role:'status' }, h('strong', {}, chosen === Q.a ? 'Yes. ' : 'Not quite. '), Q.why) : null,
    answered ? h('div', { class:'row' }, h('button', { class:'btn', onclick:function(){ if (last){ st.step = 'esito'; } else { st.qi = qi + 1; } save(); render(); } }, last ? 'See the result →' : 'Next →')) : null);
}

function scoreOf(X, st){ return X.mc.reduce(function(s, q, i){ return s + (st.answers[i] === q.a ? 1 : 0); }, 0); }

function stepResult(X, st){
  const sc = scoreOf(X, st);
  const review = X.mc.map(function(q, i){
    const ok = st.answers[i] === q.a;
    return h('div', { class:'rev' },
      h('span', { class:'m', style:'color:' + (ok ? '#3DDC84' : '#FF4A2E') }, ok ? '✓' : '✗'),
      h('span', {}, h('strong', {}, (i + 1) + '. '), q.q, h('br'), h('span', { class:'mute' }, q.why)));
  });
  return h('div', { class:'card' }, segs('esito'),
    h('div', { class:'mono mute' }, 'Step 5 of 5 · Esito'),

}

function mailOf(st){ if (!st.mail) st.mail = { text:'', started:'', filed:false, filedAt:'', graded:null, score:null, gradedAt:'' }; return st.mail; }
function wordCount(t){ const m = (t || '').trim().match(/\S+/g); return m ? m.length : 0; }
function copyText(t, done){
  function fallback(){
    const ta = h('textarea', { style:'position:fixed;left:-999px;top:0' });
    ta.value = t; document.body.append(ta); ta.select();
    try { if (document.execCommand('copy')) done(true); else done(false); } catch (e) { done(false); }
    ta.remove();
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ done(true); }, fallback); return; }
  } catch (e) {}
  fallback();
}
function mailPrompt(E){
  return h('div', { class:'card paper', style:'gap:8px' },

/* ============================================================
   VIEW: UDIENZA RAPIDA  (5 questions + 3 chunks, once a day)
   ============================================================ */
let U = null;
function buildDeck(){
  const qs = [], cs = [];
  filedList().forEach(function(X){
    X.mc.forEach(function(q){ qs.push(q); });
    (X.vocab || []).forEach(function(c){ cs.push(c); });
  });
  const picked = shuffle(qs).slice(0, 5).map(function(q){
    const o = shuffle(q.o.map(function(t, i){ return { t:t, i:i }; }));
    return { q:q.q, why:q.why, o:o, a:q.a };
  });
  return { qs:picked, cs:shuffle(cs).slice(0, 3), i:0, right:0, got:0, phase:'q', chosen:null, flipped:false };
}
function finishHearing(){
  const t = new Date(), today = ymd(t), H = S.hearings;
  if (H.last !== today){
    H.streak = (H.last === ymd(prevSchoolDay(t))) ? H.streak + 1 : 1;
    H.last = today; H.count++;
    H.lastScore = U.right + ' / ' + U.qs.length + ' + ' + U.got + ' / ' + U.cs.length + ' chunks';
    save();
  }
}
function nextChunk(){
  U.flipped = false;
  if (U.i + 1 < U.cs.length){ U.i++; }
  else { U.phase = 'done'; finishHearing(); render(); knock(); burst(); return; }
  render();
}
function viewUdienza(){
  if (!filedList().length){
    return h('main', {}, h('div', { class:'card', style:'margin-top:20px' }, h('h2', { style:'font-size:32px' }, 'Nothing filed yet.'),
      h('p', { class:'mute', style:'margin:0' }, 'The hearing only uses prove you\'ve already analyzed and filed.'), h('div', { class:'row', style:'margin-top:0' }, h('a', { class:'btn', href:'#/prova/p01' }, 'Go to Prova n. 01'))));
  }
  if (!U) U = buildDeck();
  const segsRow = h('div', { class:'segs' }, U.qs.map(function(_, k){ return h('i', { class: (U.phase !== 'q' || k < U.i || (k === U.i && U.chosen !== null)) ? 'on' : '' }); }).concat(U.cs.map(function(_, k){ return h('i', { class: (U.phase === 'done' || (U.phase === 'c' && k < U.i)) ? 'on' : '' }); })));
  let body;
  if (U.phase === 'q'){
    const Q = U.qs[U.i], answered = U.chosen !== null;
    const opts = Q.o.map(function(op, k){
      let cls = 'opt';
      if (answered){ if (op.i === Q.a) cls += ' good'; else if (k === U.chosen) cls += ' bad'; }
      return h('button', { class:cls, disabled:answered, onclick:function(){ U.chosen = k; if (Q.o[k].i === Q.a){ U.right++; knock(); } render(); } }, h('b', {}, LETTERS[k]), h('span', {}, op.t));

    rec.start();
    let left = seconds;
    onTick(left);
    const iv = setInterval(function(){
      left--; onTick(left);

/* ============================================================
   v2.9 SET: timed multiple-choice sets. Section II of the 2027 exam is 55 questions in 80 min:
   Listening 25 Q / 40 min (96 s per question) and Reading 30 Q / 40 min (80 s per question).
   No feedback during the set, a visible clock, results by question type afterwards.
   Question tags are official skill codes (1.A.1 to 1.C.3); the code given to each question is this tool's judgment.
   ============================================================ */
const SET_RATE = { reading:80, listening:96 };
/* Skill codes are the official 2027 interpretive-communication learning objectives (from the teacher-reference slides).
   Which code each question gets is my own judgment, not College Board's. */
const LO = {
  '1.A.1':'Identify supporting or relevant details', '1.A.2':'Identify data points, patterns and trends',
  '1.B.1':'Determine the main idea, theme or purpose', '1.B.2':'Determine the intended audience',
  '1.B.3':'Determine point of view, perspective, tone or attitude', '1.B.4':'Identify organizing or rhetorical structures',
  '1.B.5':'Determine the meaning of words and phrases from textual cues',
  '1.C.1':'Connect information within or across sources', '1.C.2':'Synthesize meaning to draw logical conclusions', '1.C.3':'Infer implied meaning through context'
};
function loName(t){ return LO[t] ? t + ' · ' + LO[t] : t; }
const MC_TAGS = {
  p01:['1.B.1', '1.A.2', '1.A.1', '1.B.5', '1.C.2', '1.B.1'],
  a01:['1.B.1', '1.A.2', '1.A.1', '1.B.3', '1.A.1', '1.C.1'],
  p02:['1.B.1', '1.A.2', '1.A.2', '1.B.3', '1.C.1'],
  a02:['1.B.1', '1.A.1', '1.A.1', '1.A.1', '1.C.3'],
  a03:['1.B.1', '1.A.1', '1.A.1', '1.A.1', '1.B.4'],
  a04:['1.B.1', '1.A.1', '1.A.1', '1.B.3', '1.C.3'],
  a05:['1.B.1', '1.A.1', '1.A.2', '1.A.2', '1.B.4']

var SETQ = null;
function setNew(){ return { twice:false, pc:{}, phase:'setup', kind:'reading', drafts:false, n:5, items:[], i:0, ans:[], deadline:0, allowed:0, iv:null, audio:{}, used:0, res:null }; }
function setPool(kind, drafts){
  return shuffle(EXHIBITS.filter(function(X){
    if (X.draft && !drafts) return false;
    return kind === 'listening' ? X.kind === 'ascolto' : X.kind !== 'ascolto';
  })).sort(function(a, b){ return (ex(a.id).filed ? 1 : 0) - (ex(b.id).filed ? 1 : 0); });
}
function setQuestions(kind, drafts){
  const items = [];
  setPool(kind, drafts).forEach(function(X){
    X.mc.forEach(function(q, qi){
      items.push({ X:X, qi:qi, q:q.q, why:q.why, a:q.a, tag:(MC_TAGS[X.id] || [])[qi] || 'detail',
        o:shuffle(q.o.map(function(t, i){ return { t:t, i:i }; })) });
    });
  });

}
function fmtClock(s){ s = Math.max(0, s); return Math.floor(s / 60) + ':' + pad(s % 60); }
function setFinish(){
  const Q = SETQ;
  if (!Q || Q.phase !== 'take') return;
  if (Q.iv){ clearInterval(Q.iv); Q.iv = null; }
  Q.used = Math.min(Q.allowed, Math.round((Date.now() - (Q.deadline - Q.allowed * 1000)) / 1000));
  const byTag = {};
  let right = 0;
  Q.items.forEach(function(it, i){
    const ok = Q.ans[i] === it.a;

    byTag[it.tag] = byTag[it.tag] || [0, 0];
    byTag[it.tag][1]++;
    if (ok) byTag[it.tag][0]++;

    function paint(){ yes.classList.toggle('on', sel[k] === true); no.classList.toggle('on', sel[k] === false); yes.setAttribute('aria-pressed', String(sel[k] === true)); no.setAttribute('aria-pressed', String(sel[k] === false)); }
    yes.addEventListener('click', function(){ sel[k] = true; paint(); chk(); });
    no.addEventListener('click', function(){ sel[k] = false; paint(); chk(); });
    return h('div', { class:'crit' }, h('span', {}, t), h('span', { class:'cb' }, yes, no));
  });
  if (done()) return h('p', { class:'mute' }, 'Result recorded. See your Skills tab.');
  return h('div', { class:'stack', style:'gap:10px' },
    h('h2', { style:'font-size:22px' }, 'When your teacher has listened'),
    h('p', { class:'mute', style:'margin:0;font-size:14px' }, 'Enter what she told you for each skill. SOLID only if she said it was strong. A skill clears after three SOLID results in a row, and any NEEDS WORK resets it.'),
    crit, h('div', { class:'row' }, rec));
}
function presTimer(){
  if (PRES_IV) return;
  PRES_IV = setInterval(function(){
    if (!PRES || PRES.phase !== 'prep'){ clearInterval(PRES_IV); PRES_IV = null; return; }
    const left = Math.ceil((PRES.deadline - Date.now()) / 1000);
    const el = document.getElementById('pres-timer');
    if (el) el.textContent = fmtClock(left);
    if (left <= 0){ clearInterval(PRES_IV); PRES_IV = null; PRES.phase = 'rec'; render(); }
  }, 1000);
}
function presIntro(){
  const chip = function(k, l){ return h('button', { class:'chip' + (PRES.len === k ? ' on' : ''), 'aria-pressed':String(PRES.len === k), onclick:function(){ PRES.len = k; render(); } }, l); };
  const hasMine = presBoxes().mine;
  return h('div', { class:'card' },
    h('div', { class:'mono mute' }, 'Parlato · Presentazione del progetto · Q1 · 20% of the exam'),
    h('h2', { style:'font-size:32px' }, 'Prepare. Then talk.'),
    h('p', { style:'margin:0' }, 'On the exam you get 3 minutes to prepare and 3 minutes to record. You talk to a committee. The only paper you have is your printed PPR. Nobody scores the PPR; they score your recording.'),
    h('div', { style:'display:flex;gap:8px;flex-wrap:wrap' }, chip('train', 'TRAINING · 1 + 1 MIN'), chip('exam', 'EXAM · 3 + 3 MIN')),
    h('div', { class:'hlpanel' }, h('div', { class:'mono mute' }, 'The prompt'), h('p', { style:'margin:6px 0 0;font-size:16px;line-height:1.5' }, presPrompt())),
    h('div', { class:'hlpanel' }, h('div', { class:'mono mute' }, 'Factors · choose at least two'), PRES_FACTORS.map(function(f){ return h('div', { style:'margin-top:6px;font-size:14px' }, h('span', { class:'mono mute', style:'font-size:10px' }, f.c.toUpperCase() + ' · '), f.t); })),
    !hasMine ? h('div', { class:'alert' }, 'You have not written your own PPR yet, so the sample PPR will show. Build yours on the PPR page first, or practice with the sample.') : null,
    h('p', { class:'mute', style:'margin:0;font-size:12px' }, 'Practice prompt and factors are modelled on a teacher-training simulation, not College Board. Your real prompt arrives in January; paste it on the PPR page and it replaces this one. You need a wired headset.'),
    h('div', { class:'row' }, h('button', { class:'btn', onclick:function(){ PRES.deadline = Date.now() + presSecs() * 1000; PRES.phase = 'prep'; render(); } }, 'Start preparing'), h('a', { class:'btn alt', href:'#/ppr' }, 'Build my PPR')));
}
function presPrep(){
  presTimer();
  const ta = h('textarea', { 'aria-label':'Scratch paper', placeholder:'Scratch paper. Key words only.', style:'min-height:120px' });
  ta.value = PRES.notes; ta.addEventListener('input', function(){ PRES.notes = ta.value; });
  return h('div', { class:'stack' },
    h('div', { class:'card', style:'flex-direction:row;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5' }, h('span', { class:'mono mute' }, 'Preparation'), h('span', { id:'pres-timer', class:'mono', style:'font-size:22px;color:#C8FF3D' }, fmtClock(Math.ceil((PRES.deadline - Date.now()) / 1000)))),
    h('div', { class:'card' }, h('div', { class:'mono mute' }, 'THE PROMPT'), h('div', { style:'font-size:17px;line-height:1.5' }, presPrompt()),
      h('div', { class:'mute', style:'font-size:13px' }, 'Pick at least two factors: ' + PRES_FACTORS.map(function(f){ return f.t; }).join(' · '))),
    presPpr(),
    h('div', { class:'card' }, ta, h('div', { class:'row' }, h('button', { class:'btn alt', onclick:function(){ PRES.phase = 'rec'; PRES.deadline = 0; render(); } }, 'I am ready, go to recording'))));
}
function presRec(){
  const secs = presSecs();
  const tm = h('div', { class:'big', style:'font-size:64px;color:#C8FF3D' }, fmtClock(secs));
  const status = h('div', { class:'mono mute' }, PRES.micMsg || 'You cannot stop early. When you press the button, the clock starts. Keep talking until it ends.');
  const btn = h('button', { class:'btn hot', onclick:function(){
    btn.setAttribute('disabled', '');
    status.textContent = 'Recording… keep talking until the end.';
    recordFor(secs, function(left){ tm.textContent = fmtClock(Math.max(0, left)); },
      function(blob){ PRES.url = URL.createObjectURL(blob); PRES.phase = 'review'; render(); },
      function(m){ PRES.micMsg = m; status.textContent = m; btn.removeAttribute('disabled'); });
  } }, 'Start the recording');
  return h('div', { class:'stack' },
    h('div', { class:'card' }, h('div', { class:'mono mute' }, 'THE PROMPT'), h('div', { style:'font-size:17px;line-height:1.5' }, presPrompt())),
    presPpr(),
    PRES.notes ? h('div', { class:'hlpanel', style:'white-space:pre-wrap' }, h('div', { class:'mono mute' }, 'Your scratch paper'), PRES.notes) : null,
    h('div', { class:'card' }, tm, status, h('div', { class:'row' }, btn)));
}
function presReview(){
  if (!PRES.counted){ PRES.counted = true; S.pres = S.pres || { n:0 }; S.pres.n = (S.pres.n || 0) + 1; save(); }
  const chips = PRES_SELF.map(function(t, i){
    const c = h('button', { class:'chip' + (PRES.self[i] ? ' on' : ''), 'aria-pressed':String(PRES.self[i]) }, t);
    c.addEventListener('click', function(){ PRES.self[i] = !PRES.self[i]; c.classList.toggle('on', PRES.self[i]); c.setAttribute('aria-pressed', String(PRES.self[i])); });
    return c;
  });
  return h('div', { class:'card' },
    h('div', { class:'mono mute' }, 'Presentation ' + S.pres.n + ' recorded'),
    h('h2', { style:'font-size:32px' }, 'Listen to yourself.'),
    h('audio', { controls:true, src:PRES.url, style:'width:100%' }),
    h('a', { class:'btn alt sm', href:PRES.url, download:'presentazione.webm', target:'_blank', rel:'noopener', style:'align-self:flex-start' }, 'Download for your teacher'),
    h('p', { class:'mute', style:'margin:0;font-size:14px' }, 'Check yourself honestly:'),
    h('div', { style:'display:flex;gap:8px;flex-wrap:wrap' }, chips),
    gradeBox(0, function(){ return PRES.graded; }, function(){ PRES.graded = true; }),
    h('div', { class:'row' }, h('button', { class:'btn alt', onclick:function(){ PRES = presNew(); render(); } }, 'Run it again'), h('a', { class:'btn ghost', href:'#/' }, 'Back to today')));
}
function viewPresentazione(){
  if (!PRES) PRES = presNew();
  const body = PRES.phase === 'intro' ? presIntro() : (PRES.phase === 'prep' ? presPrep() : (PRES.phase === 'rec' ? presRec() : presReview()));
  return h('main', {}, h('div', { style:'margin:10px 0 16px' }, h('a', { href:'#/', class:'mono', style:'text-decoration:none' }, '← Today')), body);
}

/* ============================================================
   ROUTER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  const route = currentRoute();
  let view;
  if (route.indexOf('/prova/') === 0) view = viewProva(route.slice(7));
  else if (route === '/udienza') view = viewUdienza();
  else if (route === '/skills') view = viewSkills();
  else if (route === '/parlato') view = viewParlato();
  else if (route === '/set') view = viewSet();
  else if (route === '/ppr') view = viewPpr();
  else if (route === '/saggio') view = viewSaggio();
  else if (route === '/presentazione') view = viewPresentazione();
  else if (route === '/archivio') view = viewArchivio();
  else view = viewOggi();
  app.replaceChildren.apply(app, topbar().concat([tabs(), view]).filter(Boolean));
}
/* in-page navigation: works in a normal tab AND inside preview windows where #links can fail */
document.addEventListener('click', function(e){
  const a = e.target && e.target.closest ? e.target.closest('a[href^="#/"]') : null;
  if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || a.getAttribute('target') === '_blank') return;
  e.preventDefault();
  go(a.getAttribute('href').slice(1));
});
window.addEventListener('hashchange', function(){
  ROUTE = (location.hash || '#/').replace(/^#/, '') || '/';
  if (ROUTE !== '/udienza') U = null;
  render(); window.scrollTo(0, 0);
});
render();
</script>
